name: Build neko_drv 6.1.ko.sh

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install build dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends \
          git curl wget python3 make \
          bc bison flex libssl-dev libelf-dev \
          gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
          cpio kmod file ca-certificates

    - name: Download AOSP Clang toolchain
      run: |
        mkdir -p $HOME/clang
        wget -q --show-progress \
          "https://github.com/ZyCromerZ/Clang/releases/download/19.0.0git-20240618-release/Clang-19.0.0git-20240618.tar.gz" \
          -O /tmp/clang.tar.gz
        tar -xf /tmp/clang.tar.gz -C $HOME/clang
        echo "$HOME/clang/bin" >> $GITHUB_PATH
        $HOME/clang/bin/clang --version

    - name: Clone Android common kernel 6.1
      run: |
        git clone --depth=1 \
          --branch android14-6.1 \
          https://android.googlesource.com/kernel/common \
          $HOME/kernel
        echo "KERNELDIR=$HOME/kernel" >> $GITHUB_ENV

    - name: Stage driver sources
      run: |
        KMOD_DIR=$HOME/kernel/drivers/staging/neko
        mkdir -p "$KMOD_DIR"
        cp $GITHUB_WORKSPACE/neko_drv.c "$KMOD_DIR/"
        cp $GITHUB_WORKSPACE/neko_shm.h "$KMOD_DIR/"
        printf 'obj-m := neko_drv.o\nccflags-y += -I$(src) -g0 -fno-asynchronous-unwind-tables\n' \
          > "$KMOD_DIR/Makefile"
        echo "KMOD_DIR=$KMOD_DIR" >> $GITHUB_ENV

    - name: Prepare kernel headers
      run: |
        cd $KERNELDIR
        make -j$(nproc) \
          ARCH=arm64 \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CC=clang \
          LLVM=1 LLVM_IAS=1 \
          O=out \
          gki_defconfig
        make -j$(nproc) \
          ARCH=arm64 \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CC=clang \
          LLVM=1 LLVM_IAS=1 \
          O=out \
          modules_prepare

    - name: Build neko_drv.ko
      run: |
        make -C $KERNELDIR/out \
          M=$KMOD_DIR \
          ARCH=arm64 \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CC=clang \
          LLVM=1 LLVM_IAS=1 \
          modules
        ls -lh $KMOD_DIR/neko_drv.ko

    - name: Strip module
      run: |
        aarch64-linux-gnu-strip --strip-debug $KMOD_DIR/neko_drv.ko

    - name: Pack as 6.1.ko.sh
      run: |
        sh $GITHUB_WORKSPACE/pack_ko.sh \
          $KMOD_DIR/neko_drv.ko \
          $GITHUB_WORKSPACE/6.1.ko.sh

    - name: Upload 6.1.ko.sh
      uses: actions/upload-artifact@v4
      with:
        name: neko-6.1-driver
        path: 6.1.ko.sh
        retention-days: 30
